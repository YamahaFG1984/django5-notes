<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Images bookmarked</title></head>
<body>
<div layout:fragment="content">
  <h1>Images bookmarked</h1>
  <div id="image-list">
    <!--/* {% include "images/image/list_images.html" %} */-->
    <th:block th:replace="~{images/image/list_images :: images}"></th:block>
  </div>
</div>

<script layout:fragment="domready">
  // 无限滚动：接近页面底部时请求下一页的 HTML 片段，追加到列表末尾
  let page = 1;
  let emptyPage = false;
  let blockRequest = false;

  window.addEventListener('scroll', function () {
    const margin = document.body.clientHeight - window.innerHeight - 200;
    if (window.pageYOffset > margin && !emptyPage && !blockRequest) {
      blockRequest = true;
      page += 1;
      fetch('?images_only=1&page=' + page)
        .then(response => response.text())
        .then(html => {
          if (html.trim() === '') {        // 服务端对越界页返回空内容
            emptyPage = true;
          } else {
            document.getElementById('image-list').insertAdjacentHTML('beforeEnd', html);
            blockRequest = false;
          }
        });
    }
  });

  window.dispatchEvent(new Event('scroll'));
</script>
</body>
</html>
