<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Create an account</title></head>
<body>
<div layout:fragment="content">
  <h1>Create an account</h1>
  <p>Please, sign up using the following form:</p>
  <form method="post" th:action="@{/account/register/}" th:object="${userForm}">
    <div th:replace="~{fragments/forms :: field('username', 'Username', 'text')}"></div>
    <div th:replace="~{fragments/forms :: field('firstName', 'First name', 'text')}"></div>
    <div th:replace="~{fragments/forms :: field('email', 'Email address', 'email')}"></div>
    <div th:replace="~{fragments/forms :: field('password', 'Password', 'password')}"></div>
    <div th:replace="~{fragments/forms :: field('password2', 'Repeat password', 'password')}"></div>
    <p><input type="submit" value="Create my account"></p>
  </form>
</div>
</body>
</html>
