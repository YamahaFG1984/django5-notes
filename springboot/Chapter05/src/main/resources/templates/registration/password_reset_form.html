<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Reset your password</title></head>
<body>
<div layout:fragment="content">
  <h1>Forgotten your password?</h1>
  <p>Enter your e-mail address to obtain a new password.</p>
  <form method="post" th:action="@{/account/password-reset/}" th:object="${form}">
    <div th:replace="~{fragments/forms :: field('email', 'Email', 'email')}"></div>
    <p><input type="submit" value="Send e-mail"></p>
  </form>
</div>
</body>
</html>
