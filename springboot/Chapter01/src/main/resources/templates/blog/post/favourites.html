<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{blog/base}">
<head>
  <title>Your favourite posts</title>
</head>
<body>
<div layout:fragment="content">
  <h1>Your favourite posts</h1>
  <th:block th:each="post : ${favouritePosts}">
    <h2>
      <a th:href="@{${post.absoluteUrl}}" th:text="${post.title}">Post title</a>
    </h2>
    <p class="date">
      Published <span th:text="${#temporals.format(post.publish, 'MMM d, yyyy, HH:mm')}">date</span>
      by <span th:text="${post.author}">author</span>
    </p>
    <div th:utext="${#text.linebreaks(#text.truncatewords(post.body, 30))}"></div>
  </th:block>
  <p th:if="${#lists.isEmpty(favouritePosts)}">You have no favourite posts yet.</p>
</div>
</body>
</html>
