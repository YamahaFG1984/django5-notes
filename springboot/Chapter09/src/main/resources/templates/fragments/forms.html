<!DOCTYPE html>
<!--/* 可复用的表单片段。field(...) ≈ Django 5.0 的 {{ form.name.as_field_group }}：
       一次渲染 label、控件和错误信息。必须放在带 th:object 的元素里使用。
       type 可以是 text / email / password / date / file / textarea / hidden。 */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="field(name, label, type)">
  <div class="field">
    <label th:for="${name}" th:text="|${label}:|">Label:</label>
    <ul class="errorlist" th:if="${#fields.hasErrors(name)}">
      <li th:each="err : ${#fields.errors(name)}" th:text="${err}">error</li>
    </ul>
    <textarea th:if="${type == 'textarea'}" th:field="*{__${name}__}" rows="6"></textarea>
    <!--/* 密码框和文件框不回填值：校验失败重新显示表单时，不能把用户输入的密码写回 HTML */-->
    <input th:if="${type == 'password' or type == 'file'}" th:type="${type}" th:id="${name}" th:name="${name}">
    <input th:if="${type != 'textarea' and type != 'password' and type != 'file'}" th:type="${type}" th:field="*{__${name}__}">
  </div>
</th:block>
</body>
</html>
