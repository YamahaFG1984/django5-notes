<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Dashboard</title></head>
<body>
<div layout:fragment="content">
  <h1>Dashboard</h1>
  <p th:with="total=${totalImagesCreated}">
    Welcome to your dashboard. You have bookmarked
    <span th:text="|${total} image${total == 1 ? '' : 's'}|">0 images</span>.
  </p>
  <!--/* 书签小工具：把这个按钮拖到浏览器书签栏；href 是一段 javascript: 代码（由 BookmarkletLauncher 生成） */-->
  <p>Drag the following button to your bookmarks toolbar to bookmark images from other websites →
     <a th:href="${bookmarklet}" class="button">Bookmark it</a></p>
  <p>You can also <a th:href="@{/account/edit/}">edit your profile</a>
     or <a th:href="@{/account/password-change/}">change your password</a>.</p>
</div>
</body>
</html>
