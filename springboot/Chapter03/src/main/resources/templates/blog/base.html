<!DOCTYPE html>
<!--/* 基础模板。#blog 来自 BlogDialect（≈ {% load blog_tags %}），全局可用，不需要 load。 */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="utf-8">
  <title layout:title-pattern="$CONTENT_TITLE">My blog</title>
  <link th:href="@{/static/css/blog.css}" rel="stylesheet">
</head>
<body>
  <div id="content">
    <div layout:fragment="content"></div>
  </div>
  <div id="sidebar">
    <h2>My blog</h2>
    <p>
      This is my blog.
      <!--/* {% total_posts %} */-->
      I've written <span th:text="${#blog.totalPosts()}">0</span> posts so far.
    </p>
    <p>
      <a th:href="@{/blog/feed/}">Subscribe to my RSS feed</a>
    </p>
    <h3>Latest posts</h3>
    <!--/* {% show_latest_posts 3 %}：inclusion tag = 取数据的方法 + 一个模板片段 */-->
    <div th:replace="~{blog/post/latest_posts :: latestPosts(${#blog.latestPosts(3)})}"></div>
    <h3>Most commented posts</h3>
    <!--/* {% get_most_commented_posts as most_commented_posts %} */-->
    <ul th:with="mostCommentedPosts=${#blog.mostCommentedPosts(5)}">
      <li th:each="post : ${mostCommentedPosts}">
        <a th:href="@{${post.absoluteUrl}}" th:text="${post.title}">title</a>
      </li>
    </ul>
    <p><a th:href="@{/blog/search/}">Search</a></p>
  </div>
</body>
</html>
